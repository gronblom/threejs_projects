<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arctic Waters · three.js projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="home chip" href="../../">← Home</a>

    <nav class="tabs chip" aria-label="Scene settings">
      <button type="button" data-panel="views" aria-expanded="false">Views</button>
      <button type="button" data-panel="water" aria-expanded="false">Water &amp; Light</button>
      <button type="button" data-panel="camera" aria-expanded="false">Camera</button>
    </nav>

    <section class="panel" id="panel-views" hidden>
      <h2>Views</h2>
      <div class="views" id="view-buttons"></div>
      <label class="row toggle"><span>Boat under way</span><input type="checkbox" id="cruise" checked /></label>
    </section>

    <section class="panel" id="panel-water" hidden>
      <h2>Water &amp; Light</h2>
      <div class="sky-source">
        <span class="eyebrow">Sky</span>
        <span id="sky-source">Generated clouds</span>
      </div>
      <div class="sky-buttons">
        <button type="button" class="wide" id="load-sky">Load sky image…</button>
        <button type="button" class="wide" id="new-sky">New generated sky</button>
        <button type="button" class="wide" id="generated-sky" hidden>Back to generated sky</button>
      </div>
      <input type="file" id="sky-file" accept=".hdr,.exr,.jpg,.jpeg,.png,.webp" hidden />
      <p class="note">Any 360° panorama works (2:1 image). Drop one anywhere on the page.</p>
      <div id="sky-controls"></div>
      <div id="generated-controls"></div>
      <div id="water-controls"></div>
      <span class="eyebrow">Look</span>
      <div id="grade-controls"></div>
    </section>

    <section class="panel" id="panel-camera" hidden>
      <h2>Camera</h2>
      <div id="camera-controls"></div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
